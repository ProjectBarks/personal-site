# This repo is the SOURCE for brandonbarker.me. The built site is published to
# ProjectBarks/projectbarks.github.io, which is what the domain actually serves.
#
# GitHub Pages is nonetheless still enabled on this repo and runs the legacy
# Jekyll builder on every push. Jekyll treats any file beginning with `---` as
# having YAML front matter, and every .astro component starts with `---`
# followed by JavaScript, so the build fails. A root .nojekyll does not help:
# the generated "pages build and deployment" workflow runs jekyll-build-pages
# unconditionally in branch mode.
#
# Excluding the source tree keeps that build green. The real fix is to turn
# Pages off for this repo in Settings > Pages, at which point this file and the
# root .nojekyll can both go.
exclude:
  - src
  - public
  - build
  - node_modules
  - design-variations
  - docs
  - astro.config.mjs
  - package.json
  - package-lock.json
  - tsconfig.json
  - DESIGN.md
  - PRODUCT.md
